name: Website bauen und veröffentlichen

# Läuft nur von Hand: GitHub -> Reiter "Actions" -> diesen Arbeitsablauf
# wählen -> "Run workflow".
#
# Bewusst nicht bei jedem Push: Der Upload spiegelt dist/ mit --delete auf
# den Webserver und löscht dort alles, was nicht in dist/ liegt, auch die
# alte Joomla-Seite. Solange Impressum und Datenschutz Platzhalter sind,
# darf nichts davon automatisch live gehen. Ist die Seite fertig, lässt sich
# hier ein Push-Trigger ergänzen:
#     push:
#       branches: [main]
#
# Der Build erzeugt fertiges HTML; auf dem Webserver läuft kein Node.js.
on:
  workflow_dispatch:

jobs:
  bauen-und-hochladen:
    runs-on: ubuntu-latest

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Pakete installieren
        run: npm ci

      - name: Website bauen
        run: npm run build

      # Hochladen per SFTP mit lftp. Bewusst ohne fremde Action:
      # die Zugangsdaten bleiben so in diesem Arbeitsablauf.
      - name: lftp installieren
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Auf Alfahosting hochladen
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          SFTP_PFAD: ${{ secrets.SFTP_PFAD }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            open -u \"$SFTP_USER\",\"$SFTP_PASS\" sftp://$SFTP_HOST;
            mirror --reverse --delete --verbose --parallel=4 \
                   --exclude-glob .git* \
                   --exclude '^matchplay-winter/(api\.php|data\.json|data\.bak\.json|users\.php|verlauf\.php|meldungen\.php|fotos\.php|terminspieler\.php|sperre\.lock|fotos/.*)$' \
                   dist/ \"$SFTP_PFAD\";
          "

# ═══════════════════════════════════════════════════════════════
#  EINMALIG EINZURICHTEN
#  ───────────────────────────────────────────────────────────────
#  Im GitHub-Repository unter
#     Settings -> Secrets and variables -> Actions -> New secret
#  diese vier Werte anlegen:
#
#     SFTP_HOST   Servername von Alfahosting, z.B. ssh.alfahosting.de
#     SFTP_USER   SSH-Benutzername aus dem Alfahosting-Kundenmenü
#     SFTP_PASS   zugehöriges Passwort
#     SFTP_PFAD   Zielverzeichnis, meist /htdocs oder /html
#
#  Die Werte sind danach nicht mehr einsehbar — auch nicht für
#  Administratoren. Wer sie verliert, legt sie neu an.
# ═══════════════════════════════════════════════════════════════
